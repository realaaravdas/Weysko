[package]
name = "weysko-installer"
version = "1.3.1"
edition = "2021"
license = "MIT"
description = "Native pure-Rust Windows Setup Wizard and Uninstaller for Weysko"

[[bin]]
name = "weysko-setup"
path = "src/main.rs"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
rfd = "0.15"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
open = "5.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[build-dependencies]
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

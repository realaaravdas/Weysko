[package]
name = "websir"
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/realaaravdas/Websir"
homepage = "https://realaaravdas.github.io/Websir/"
description = "Pure-Rust, zero-AI visual website studio and static site generator with a dark minimalist slate UI"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
rfd = "0.15"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
open = "5.3"
